<style>
  :root {
    --bg: #0e0c0a;
    --surface: #161410;
    --card: #1c1916;
    --border: #2e2a24;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #f5f0e8;
    --muted: #7a7060;
    --accent1: #b05a3a;
    --accent2: #3a6b8a;
    --accent3: #5a7a3a;
    --text: #e8e0d0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 60px 24px 40px;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .header-label {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(32px, 6vw, 64px);
    font-weight: 900;
    line-height: 1.1;
    color: var(--cream);
    margin-bottom: 16px;
  }

  h1 em {
    font-style: italic;
    color: var(--gold-light);
  }

  .header-sub {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 24px auto;
    opacity: 0.5;
  }

  /* Filters */
  .filters {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 0 24px 40px;
  }

  .filter-btn {
    padding: 7px 18px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.07);
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 2px;
    padding: 0 2px 60px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 32px 28px;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: var(--card-accent, var(--gold));
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 0.3s ease;
  }

  .card:hover::before, .card.open::before {
    transform: scaleY(1);
  }

  .card:hover {
    background: #201e1a;
    border-color: #3e3830;
  }

  .card.open {
    background: #201e1a;
    border-color: var(--card-accent, var(--gold));
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 0;
  }

  .card-number {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    padding-top: 6px;
    flex-shrink: 0;
  }

  .card-title-block { flex: 1; }

  .card-category {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--card-accent, var(--gold));
    margin-bottom: 6px;
    opacity: 0.8;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--cream);
    line-height: 1.2;
  }

  .card-tagline {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
    font-style: italic;
    line-height: 1.5;
  }

  .card-toggle {
    color: var(--muted);
    font-size: 18px;
    transition: transform 0.3s;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .card.open .card-toggle { transform: rotate(45deg); color: var(--gold); }

  /* Body */
  .card-body {
    display: none;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    animation: fadeIn 0.3s ease;
  }

  .card.open .card-body { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--card-accent, var(--gold));
    margin-bottom: 8px;
    opacity: 0.7;
  }

  .section-content {
    font-size: 14px;
    line-height: 1.75;
    color: #b8b0a0;
    margin-bottom: 20px;
  }

  .quote-block {
    background: rgba(201,168,76,0.05);
    border-left: 2px solid var(--card-accent, var(--gold));
    padding: 14px 18px;
    margin-bottom: 20px;
    border-radius: 0 4px 4px 0;
  }

  .quote-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--cream);
    line-height: 1.6;
  }

  .quote-author {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 8px;
  }

  .philosophers {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .philosopher-tag {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    color: var(--muted);
  }

  .problems {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .problem-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    color: #9a9080;
    line-height: 1.5;
  }

  .problem-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--card-accent, var(--gold));
    flex-shrink: 0;
    margin-top: 7px;
    opacity: 0.7;
  }

  footer {

    padding: 30px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    border-top: 1px solid var(--border);

</style>

    philosophers: ["Platon", "Descartes", "Nietzsche", "James", "Hegel", "Bachelard"],
    problems: [
      "La vérité est-elle relative ou absolue ?",
      "Peut-on atteindre la vérité ?",
      "Faut-il toujours dire la vérité ?",
      "La vérité est-elle différente selon les domaines (science, art, morale) ?"
    ]
  },
  {
    id: 17,
    title: "Le Temps",
    category: "existence",
    catLabel: "Existence & Culture",
    accent: "#9a4a6a",
    tagline: "La dimension dans laquelle se déroule l'existence",
    definition: "Le temps est la dimension dans laquelle se succèdent les événements (passé, présent, futur). Saint Augustin avoue : « Qu'est-ce donc que le temps ? Si personne ne me le demande, je le sais ; si je veux l'expliquer, je ne le sais plus. » Bergson distingue le temps scientifique (mesurable) de la durée vécue (intérieure).",
    quote: { text: "Qu'est-ce que le temps ? Si personne ne me le demande, je le sais ; si je veux l'expliquer, je ne le sais plus.", author: "Saint Augustin, Confessions" },
    philosophers: ["Augustin", "Bergson", "Heidegger", "Husserl", "Newton", "Kant"],
    problems: [
      "Le temps existe-t-il objectivement ou n'est-il que subjectif ?",
      "Peut-on maîtriser le temps ?",
      "Le passé est-il encore réel ?",
      "Qu'est-ce que vivre dans l'instant présent ?"
    ]
  }
];

const catColors = {
  existence: "#3a8a6b",
  morale: "#b05a3a",
  connaissance: "#3a6b8a"
};

function getAccent(notion) {
  return notion.accent || catColors[notion.category] || "#c9a84c";
}

function renderCards(filter = 'all') {
  const grid = document.getElementById('grid');
  const filtered = filter === 'all' ? notions : notions.filter(n => n.category === filter);
  grid.innerHTML = '';
  filtered.forEach((n, i) => {
    const accent = getAccent(n);
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--card-accent', accent);
    card.setAttribute('data-id', n.id);
    card.innerHTML = `
      <div class="card-header">
        <div class="card-number">0${n.id < 10 ? '0' + n.id : n.id}</div>
        <div class="card-title-block">
          <div class="card-category">${n.catLabel}</div>
          <div class="card-title">${n.title}</div>
          <div class="card-tagline">${n.tagline}</div>
        </div>
        <div class="card-toggle">+</div>
      </div>
      <div class="card-body">
        <div class="section-label">Définition</div>
        <div class="section-content">${n.definition}</div>

        <div class="section-label">Citation clé</div>
        <div class="quote-block">
          <div class="quote-text">« ${n.quote.text} »</div>
          <div class="quote-author">— ${n.quote.author}</div>
        </div>

        <div class="section-label">Philosophes à connaître</div>
        <div class="philosophers">${n.philosophers.map(p => `<span class="philosopher-tag">${p}</span>`).join('')}</div>

        <div class="section-label">Problématiques essentielles</div>
        <div class="problems">${n.problems.map(p => `<div class="problem-item"><div class="problem-dot"></div><span>${p}</span></div>`).join('')}</div>
      </div>
    `;
    card.addEventListener('click', () => {
      const isOpen = card.classList.contains('open');
      document.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));
      if (!isOpen) card.classList.add('open');
    });
    grid.appendChild(card);
  });
}

function filterCards(cat) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderCards(cat);
}

renderCards();
</script>
</body>
</html>
